const CONNECTED=typeof google!=='undefined' && !!google.script && !!google.script.run;
const qs=$=>document.querySelector($);
const escapeHTML=s=>String(s==null?'':s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const fmt=n=>Number.isInteger(Number(n))?String(n):Number(n).toFixed(1);
const uid=()=> (typeof crypto!=='undefined' && crypto.randomUUID)?crypto.randomUUID():('attempt-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const CHAPTER_NAMES={chapter1:'Chapter 1',chapter2:'Chapter 2',chapter3:'Chapter 3'};
const S={screen:location.hash==='#admin'?'login':'home',chapter:'chapter1',mode:'exam',idx:0,answers:{},locks:{},student:null,seconds:0,nonce:null,report:null,error:'',busy:false,adminData:null,pin:null,tab:'attempts',query:'',chapterFilter:'all',lastEntered:{}};
let interval=null;
const localStore={};
function getItem(k){try{return localStorage.getItem(k)}catch(e){return localStore[k]??null}}
function setItem(k,v){try{localStorage.setItem(k,v)}catch(e){localStore[k]=String(v)}}
function fakeDb(){try{return JSON.parse(getItem('phys141_local_demo')||'{"students":[],"attempts":[]}')}catch(e){return {students:[],attempts:[]}}}
function demoApi(name,args){const db=fakeDb();
  if(name==='registerStudent'){
    const value=args[0],name=String(value.name||'').trim(),phone=String(value.phone||'').replace(/[\s()\-]/g,'');
    if(name.length<2||!/^\+?\d{8,15}$/.test(phone))throw Error('اسم الطالب أو رقم الجوال غير صحيح.');
    let student=db.students.find(s=>s.phone===phone);
    if(!student){student={id:uid(),name,phone,token:uid()+uid(),registeredAt:new Date().toLocaleString('sv-SE')};db.students.push(student)}
    student.name=name;setItem('phys141_local_demo',JSON.stringify(db));return student;
  }
  if(name==='submitAttempt'){
    const x=args[0];let old=db.attempts.find(a=>a.nonce===x.nonce);if(old)return {attemptId:old.id,score:old.score,max:old.max,percent:old.percent,correct:old.correct,answered:old.answered,total:old.total,excluded:old.excluded,saved:false};
    const questions=DATA.chapters[x.chapter].questions;const max=questions.filter(q=>q.gradable).length;
    const correct=questions.filter(q=>q.gradable&&x.answers[q.id]===q.answer).length;
    const student=db.students.find(st=>st.id===x.studentId);
    const score=correct,total=questions.length,excluded=total-max,percent=Math.round(1000*score/max)/10;
    old={nonce:x.nonce,id:uid(),name:student?.name||'Student',phone:student?.phone||'',chapter:x.chapter,mode:x.mode,score,max,percent,correct,answered:Object.keys(x.answers).length,total,excluded,seconds:x.seconds,date:new Date().toLocaleString('sv-SE')};
    db.attempts.unshift(old);setItem('phys141_local_demo',JSON.stringify(db));return {attemptId:old.id,score,max,percent,correct,answered:old.answered,total,excluded,saved:false};
  }
  if(name==='getAdminDashboard'){
    if(args[0]!=='demo123')throw Error('رمز المعاينة غير صحيح.');
    const attempts=db.attempts,students=db.students,stats={students:students.length,attempts:attempts.length,chapter1:0,chapter2:0,chapter3:0,averagePercent:0};
    attempts.forEach(a=>stats[a.chapter]++);
    stats.averagePercent=attempts.length?Math.round(attempts.reduce((sum,a)=>sum+a.percent,0)/attempts.length*10)/10:0;
    return {students,attempts,stats,warning:''};
  }
  throw Error('Operation not available');
}
function api(name,...args){
 if(!CONNECTED)return new Promise((ok,no)=>setTimeout(()=>{try{ok(demoApi(name,args))}catch(e){no(e)}},120));
 return new Promise((ok,no)=>{google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(Error(e.message||String(e))))[name](...args)});
}
function currentChapter(){return DATA.chapters[S.chapter]}
function questions(){return currentChapter().questions}
function count(){return questions().length}
function answered(){return Object.keys(S.answers).length}
function grade(){const all=questions(),max=all.filter(q=>q.gradable).length,score=all.filter(q=>q.gradable&&S.answers[q.id]===q.answer).length;return {max,score,percent:Math.round(score/max*1000)/10,correct:score,answered:answered(),total:all.length,excluded:all.length-max}}
function elapsed(){return String(Math.floor(S.seconds/60)).padStart(2,'0')+':'+String(S.seconds%60).padStart(2,'0')}
function sscrollUp(){if(interval)clearInterval(interval);interval=null}
function start(){sscrollUp();interval=setInterval(()=>{if(S.screen==='quiz'){S.seconds++;const t=qs('#timer');if(t)t.textContent=elapsed()}},1000)}
function scrollUp(){window.scrollTo({top:0,behavior:'smooth'})}
function goHome(){sscrollUp();location.hash='';S.screen='home';S.error='';paint();scrollUp()}
function openChapter(id){S.chapter=id;S.screen='register';S.mode='exam';S.error='';S.answers={};S.locks={};S.idx=0;paint();scrollUp()}
function login(){sscrollUp();S.screen='login';S.error='';location.hash='#admin';paint();scrollUp()}
function paint(){const e=qs('#app');if(!e)return;
 e.innerHTML=S.screen==='home'?home():S.screen==='register'?registration():S.screen==='quiz'?quiz():S.screen==='sending'?sending():S.screen==='result'?results():S.screen==='login'?adminLogin():dashboard();bind();}
function home(){return `<div class="hero"><div><div class="chapter-sub">PHYS 141 · YUSUF MOHAMMAD</div><h1>اختبارات الفيزياء العامة</h1><p>اختر الفصل، وسجّل اسمك ورقم جوالك، ثم أجب عن الأسئلة كما وردت في النموذج التجريبي المرفق. تظهر الدرجة مع مراجعة إجاباتك بعد التسليم.</p></div><div class="stat"><b>98</b><span>سؤالًا من النموذج الأصلي</span></div></div><h2 class="section-title">اختر الاختبار</h2><div class="chap-grid">${Object.values(DATA.chapters).map(c=>`<article class="chapter-card"><div class="ch-label">PHYS 141</div><h3 dir="ltr">${c.label}</h3><div class="subtitle" dir="ltr">${escapeHTML(c.subtitle)}</div><div class="countbox"><span>${c.mcCount} Multiple Choice</span><span>${c.tfCount} True / False</span><span>${c.scoredCount} counted</span></div><button class="btn primary full" data-open="${c.id}">تسجيل الطالب وبدء الاختبار ←</button></article>`).join('')}</div><div class="teacher-entry"><small>Yusuf Mohammad · PHYS 141</small><button class="btn outline" id="teacher">لوحة متابعة المدرس</button></div>`}
function problem(){return S.error?`<div class="error">${escapeHTML(S.error)}</div>`:''}
function registration(){const c=currentChapter();return `<div class="center-wrap"><button class="return" id="back">→ العودة</button><section class="sheet"><div class="chapter-sub">PHYS 141 · STUDENT REGISTRATION</div><h2 dir="ltr">${c.label} — Practice Test</h2><p dir="ltr" class="muted">${escapeHTML(c.subtitle)} · ${count()} Questions</p><form id="register"><label class="label" for="name">اسم الطالب الكامل</label><input id="name" class="field" required minlength="2" maxlength="80" autocomplete="name" placeholder="اسم الطالب" value="${escapeHTML(S.lastEntered.name||'')}"><label class="label" for="phone">رقم الجوال</label><input id="phone" class="field" required type="tel" inputmode="tel" maxlength="22" autocomplete="tel" dir="ltr" placeholder="05xxxxxxxx أو +9665xxxxxxxx" value="${escapeHTML(S.lastEntered.phone||'')}"><div class="label">اختر نوع الاختبار</div><div class="mode-group"><button type="button" class="mode" data-mode="exam" aria-pressed="${S.mode==='exam'}"><strong>محاكاة الاختبار</strong><span>إظهار التصحيح بعد التسليم.</span></button><button type="button" class="mode" data-mode="practice" aria-pressed="${S.mode==='practice'}"><strong>التدريب الفوري</strong><span>إظهار صحة الاختيار مباشرة.</span></button></div><div class="info">عدد الأسئلة: ${count()} — المحتسب في الدرجة: ${c.scoredCount}. ${c.scoredCount<count()?'يوجد سؤالان دون إجابة صحيحة في الخيارات الأصلية ولا يدخلان في الدرجة.':''}</div><label class="consent"><input type="checkbox" id="agree" required><span>أوافق على حفظ اسمي ورقم الجوال ونتيجة المحاولة لدى المدرس عند استخدام رابط النظام المنشور.</span></label>${problem()}<button class="btn primary full" id="register-btn" type="submit">بدء الاختبار ←</button></form></section></div>`}
async function doRegister(event){event.preventDefault();if(S.busy)return;
 const name=qs('#name').value.trim(),phone=qs('#phone').value.trim();S.lastEntered={name,phone};
 if(!qs('#agree').checked){S.error='يجب الموافقة أولًا.';paint();return}
 if(name.length<2||!/^\+?[0-9\s()\-]{8,22}$/.test(phone)){S.error='تأكد من الاسم ورقم الجوال.';paint();return}
 S.busy=true;S.error='';qs('#register-btn').disabled=true;qs('#register-btn').textContent='جارٍ تسجيل الطالب...';
 try{S.student=await api('registerStudent',{name,phone});S.screen='quiz';S.seconds=0;S.idx=0;S.nonce=uid();S.answers={};S.locks={};S.report=null;start();paint();scrollUp()}
 catch(e){S.error=e.message||'تعذر التسجيل.';paint()}
 finally{S.busy=false}
}
function goQuestion(i){S.idx=Math.max(0,Math.min(count()-1,i));paint();scrollUp()}
function choose(letter){const q=questions()[S.idx];if(S.mode==='practice'&&S.locks[q.id])return;S.answers[q.id]=letter;if(S.mode==='practice')S.locks[q.id]=true;paint()}
function notation(q){return q.type==='mc'?'Multiple Choice':'True / False'}
function quiz(){const c=currentChapter(),a=questions(),q=a[S.idx],chosen=S.answers[q.id],locked=!!S.locks[q.id],active=answered();return `<div class="quiz-layout"><div><div class="top-card"><div class="top-row"><div><strong dir="ltr">PHYS 141 · ${c.label}</strong><div class="small">${escapeHTML(S.student?.name||'')} · السؤال ${S.idx+1} من ${count()}</div></div><div class="clock">الوقت: <b id="timer">${elapsed()}</b></div></div><div class="progress"><span style="width:${Math.round(active/count()*100)}%"></span></div></div><div class="question"><div class="q-head"><span>${notation(q)} — Q${q.num}</span><span>${q.gradable?'1 mark':'غير محسوب في الدرجة'}</span></div><div dir="ltr" lang="en" class="q-body">${q.prompt}</div>${q.imageKey?`<div class="figure"><img src="${DATA.assets[q.imageKey]}" alt="Force diagram from the source document"></div>`:''}${!q.gradable?`<div class="ungraded">السؤال موجود في النموذج الأصلي، لكن مفتاح الإجابة يوضح عدم وجود خيار صحيح؛ لذلك لا يُحتسب في الدرجة.</div>`:''}<div class="answer-list" dir="ltr">${q.choices.map(choice=>{const selected=chosen===choice.letter,yes=S.mode==='practice'&&locked&&q.gradable&&choice.letter===q.answer,no=S.mode==='practice'&&locked&&selected&&q.gradable&&!yes;return `<button class="choice ${selected?'selected':''} ${yes?'right':''} ${no?'wrong':''}" data-answer="${choice.letter}" ${locked?'disabled':''} aria-pressed="${selected?'true':'false'}"><span class="letter">${choice.letter}</span><span>${choice.html}</span>${yes?'✓':''}</button>`}).join('')}</div>${S.mode==='practice'&&locked?`<div class="feedback ${q.gradable&&chosen===q.answer?'good':'bad'}">${!q.gradable?'هذا السؤال غير محسوب في الدرجة.':chosen===q.answer?'إجابة صحيحة':'إجابة غير صحيحة · الصحيح: '+q.answer}</div>`:''}</div><div class="next-row"><button class="btn outline" id="previous" ${S.idx===0?'disabled':''}>السابق</button>${S.idx===count()-1?`<button class="btn primary" id="submit">إنهاء وحفظ النتيجة</button>`:`<button class="btn primary" id="following">التالي ←</button>`}</div></div><aside class="navigator"><div class="navtitle"><strong>خريطة الأسئلة</strong><span>${active}/${count()}</span></div><div class="jump-grid" dir="ltr">${a.map((item,i)=>`<button class="jump ${S.idx===i?'current':''} ${S.answers[item.id]?'done':''}" data-jump="${i}" title="${notation(item)} ${item.num}">${i+1}</button>`).join('')}</div><div class="navnote">الأسئلة بالترتيب الأصلي: اختيار متعدد، ثم صح وخطأ.</div><button class="btn primary full" id="submit-side">إنهاء وحفظ النتيجة</button><button class="btn outline full" id="quit">الخروج</button></aside></div>`}
function sending(){return `<section class="sheet center-text"><h2>جارٍ حساب النتيجة...</h2><p>يرجى الانتظار حتى تظهر نتيجة المحاولة.</p><div class="spinner"></div></section>`}
async function endQuiz(){const left=count()-answered();if(left&&!confirm(`تبقّى ${left} سؤالًا دون إجابة. هل تريد التسليم؟`))return;sscrollUp();S.screen='sending';paint();scrollUp();await send()}
async function send(){try{S.report=await api('submitAttempt',{studentId:S.student.id,token:S.student.token,chapter:S.chapter,mode:S.mode,answers:S.answers,nonce:S.nonce,seconds:S.seconds});S.error=''}catch(e){S.error=e.message||'فشل حفظ النتيجة.';S.report=null}S.screen='result';paint();scrollUp()}
function results(){const ch=currentChapter(),summary=S.report||grade();return `<div class="result"><div class="save-status ${S.report?'saved':'failed'}">${S.error?`تعذر إرسال النتيجة للمدرس: ${escapeHTML(S.error)} <button id="resend" class="btn outline">إعادة محاولة الحفظ</button>`:CONNECTED?'تم حفظ نتيجة المحاولة بنجاح.':'تم حساب النتيجة محليًا؛ لم تُرسل إلى المدرس. تفعيل حفظ النتائج يتطلب نشر التطبيق وربطه بجدول Google Sheets.'}</div><div class="score-banner"><div><div class="chapter-sub">YUSUF MOHAMMAD · PHYS 141</div><h2>نتيجة الاختبار</h2><p>${escapeHTML(S.student?.name)} · ${ch.label}</p></div><div class="score"><strong>${summary.score} / ${summary.max}</strong><span>${fmt(summary.percent)}%</span></div></div><div class="metric"><div><b>${summary.correct}</b><span>صحيحة</span></div><div><b>${summary.total-summary.excluded-summary.correct}</b><span>خاطئة أو بدون إجابة</span></div><div><b>${summary.excluded}</b><span>غير محتسبة</span></div><div><b>${elapsed()}</b><span>الوقت</span></div></div><div class="result-actions"><button id="retry" class="btn primary">إعادة الاختبار</button><button id="print" class="btn outline">طباعة النتيجة</button><button id="home" class="btn outline">الرئيسية</button></div><h3 class="section-title">مراجعة الإجابات</h3>${questions().map(q=>{const v=S.answers[q.id],good=q.gradable&&v===q.answer;return `<article class="review ${!q.gradable?'excluded':good?'correct':'incorrect'}"><div class="review-bar"><strong>${q.type==='mc'?'MCQ':'T/F'} ${q.num}</strong><span>${!q.gradable?'غير محسوب':good?'صحيح':'يحتاج مراجعة'}</span></div><div class="review-text" dir="ltr" lang="en">${q.prompt}</div><div dir="ltr" class="review-answer">Your choice: ${v||'Not answered'}${q.gradable?` · Correct: <strong>${q.answer}</strong>`:''}</div>${q.note?`<p class="source-note">${escapeHTML(q.note)}</p>`:''}</article>`}).join('')}</div>`}
function adminLogin(){return `<div class="center-wrap"><button id="back" class="return">→ العودة</button><div class="sheet"><div class="chapter-sub">PHYS 141 · TEACHER</div><h2>لوحة متابعة الطلاب</h2><p class="muted">عرض سجلات الطلاب والدرجات يتطلب رمز الدخول الخاص بالمدرس.</p><form id="admin-form"><label class="label">رمز دخول المدرس</label><input id="passcode" class="field" type="password" required autocomplete="off" placeholder="رمز الإدارة"><p class="muted minor">${CONNECTED?'يُتحقق من الرمز على الخادم.':'في المعاينة المحلية فقط: demo123'}</p>${problem()}<button class="btn primary full" id="admin-btn" type="submit">عرض لوحة المتابعة</button></form></div></div>`}
async function auth(event){event.preventDefault();const pin=qs('#passcode').value;S.busy=true;qs('#admin-btn').disabled=true;try{S.adminData=await api('getAdminDashboard',pin);S.pin=pin;S.screen='admin';S.error='';S.query='';S.tab='attempts';S.chapterFilter='all';paint();scrollUp()}catch(e){S.error=e.message;paint()}finally{S.busy=false}}
function filtered(){const list=S.tab==='attempts'?S.adminData.attempts:S.adminData.students,term=S.query.toLowerCase();return list.filter(r=>(S.tab==='students'||S.chapterFilter==='all'||r.chapter===S.chapterFilter)&&(!term||String(r.name||'').toLowerCase().includes(term)||String(r.phone||'').includes(term)))}
function rows(){const data=filtered();if(!data.length)return `<p class="empty">لا توجد نتائج مطابقة.</p>`;return `<div class="table-wrapper"><table class="data-table"><thead><tr>${(S.tab==='attempts'?['الطالب','الجوال','الفصل','الوضع','الدرجة','النسبة','الصحيحة','وقت التسليم']:['الطالب','الجوال','تاريخ التسجيل']).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${data.map(r=>S.tab==='attempts'?`<tr><td>${escapeHTML(r.name)}</td><td dir="ltr">${escapeHTML(r.phone)}</td><td>${CHAPTER_NAMES[r.chapter]||''}</td><td>${r.mode==='exam'?'اختبار':'تدريب'}</td><td><strong>${r.score}/${r.max}</strong></td><td>${fmt(r.percent)}%</td><td>${r.correct}/${r.max}</td><td>${escapeHTML(r.date)}</td></tr>`:`<tr><td>${escapeHTML(r.name)}</td><td dir="ltr">${escapeHTML(r.phone)}</td><td>${escapeHTML(r.registeredAt)}</td></tr>`).join('')}</tbody></table></div>`}
function dashboard(){const x=S.adminData,stat=x.stats;return `<div class="admin"><div class="admin-title"><div><div class="chapter-sub">YUSUF MOHAMMAD · PHYS 141</div><h2>لوحة متابعة الطلاب</h2></div><button class="btn outline" id="logout">تسجيل الخروج</button></div><div class="stat-grid"><div><strong>${stat.students}</strong><span>الطلاب</span></div><div><strong>${stat.attempts}</strong><span>المحاولات</span></div><div><strong>${stat.chapter1}</strong><span>Chapter 1</span></div><div><strong>${stat.chapter2}</strong><span>Chapter 2</span></div><div><strong>${stat.chapter3}</strong><span>Chapter 3</span></div><div><strong>${fmt(stat.averagePercent)}%</strong><span>متوسط الدرجة</span></div></div><div class="controls"><div class="tabs"><button data-tab="attempts" aria-pressed="${S.tab==='attempts'}">نتائج الاختبارات</button><button data-tab="students" aria-pressed="${S.tab==='students'}">الطلاب المسجلون</button></div><div class="control-row"><label>بحث بالاسم أو الجوال<input class="field" id="search" value="${escapeHTML(S.query)}" placeholder="اسم / رقم الجوال"></label>${S.tab==='attempts'?`<label>الفصل<select id="filter" class="field"><option value="all">جميع الفصول</option>${Object.values(DATA.chapters).map(c=>`<option value="${c.id}" ${S.chapterFilter===c.id?'selected':''}>${c.label}</option>`).join('')}</select></label>`:''}<button id="refresh" class="btn outline">تحديث</button><button id="export" class="btn primary">تصدير CSV</button></div></div><div class="records"><div class="records-head">السجلات <small id="total-rows">${filtered().length}</small></div><div id="rows">${rows()}</div></div>${x.warning?`<p class="muted">${escapeHTML(x.warning)}</p>`:''}</div>`}
function csv(){const student=S.tab==='students',fields=student?['Name','Phone','Registered at']:['Student','Phone','Chapter','Mode','Score','Maximum','Percentage','Correct','Answered','Date'];const values=filtered().map(r=>student?[r.name,r.phone,r.registeredAt]:[r.name,r.phone,r.chapter,r.mode,r.score,r.max,r.percent,r.correct,r.answered,r.date]);const quote=x=>{let v=String(x??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"'};const txt='\ufeff'+[fields,...values].map(row=>row.map(quote).join(',')).join('\r\n');const blob=new Blob([txt],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='PHYS141_'+S.tab+'.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function refresh(){const b=qs('#refresh');if(b)b.disabled=true;try{S.adminData=await api('getAdminDashboard',S.pin);paint()}catch(e){alert('تعذر تحديث النتائج: '+e.message);if(b)b.disabled=false}}
function bind(){document.querySelectorAll('[data-open]').forEach(n=>n.onclick=()=>openChapter(n.dataset.open));
 qs('#back')?.addEventListener('click',goHome);qs('#teacher')?.addEventListener('click',login);
 qs('#register')?.addEventListener('submit',doRegister);
 document.querySelectorAll('[data-mode]').forEach(n=>n.onclick=()=>{const name=qs('#name')?.value,phone=qs('#phone')?.value,agree=qs('#agree')?.checked;S.mode=n.dataset.mode;paint();if(name!=null)qs('#name').value=name;if(phone!=null)qs('#phone').value=phone;if(agree!=null)qs('#agree').checked=agree});
 document.querySelectorAll('[data-answer]').forEach(n=>n.onclick=()=>choose(n.dataset.answer));document.querySelectorAll('[data-jump]').forEach(n=>n.onclick=()=>goQuestion(+n.dataset.jump));
 qs('#previous')?.addEventListener('click',()=>goQuestion(S.idx-1));qs('#following')?.addEventListener('click',()=>goQuestion(S.idx+1));qs('#submit')?.addEventListener('click',endQuiz);qs('#submit-side')?.addEventListener('click',endQuiz);
 qs('#quit')?.addEventListener('click',()=>{if(confirm('الخروج دون حفظ المحاولة؟'))goHome()});
 qs('#resend')?.addEventListener('click',()=>{S.screen='sending';paint();send()});qs('#retry')?.addEventListener('click',()=>openChapter(S.chapter));qs('#home')?.addEventListener('click',goHome);qs('#print')?.addEventListener('click',()=>window.print());
 qs('#admin-form')?.addEventListener('submit',auth);qs('#logout')?.addEventListener('click',()=>{S.pin=null;S.adminData=null;goHome()});
 document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{S.tab=n.dataset.tab;S.query='';paint()});qs('#search')?.addEventListener('input',e=>{S.query=e.target.value;qs('#rows').innerHTML=rows();qs('#total-rows').textContent=filtered().length});qs('#filter')?.addEventListener('change',e=>{S.chapterFilter=e.target.value;qs('#rows').innerHTML=rows();qs('#total-rows').textContent=filtered().length});qs('#export')?.addEventListener('click',csv);qs('#refresh')?.addEventListener('click',refresh);
}
window.addEventListener('hashchange',()=>{if(location.hash==='#admin'&&S.screen==='home')login()});
paint();
</script></body></html>
